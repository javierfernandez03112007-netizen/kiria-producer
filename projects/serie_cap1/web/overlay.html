<!doctype html>
<html><head><meta charset="utf-8">
<title>Serie cap. 1 · gráficos</title>
<style>
@font-face { font-family: Anton; src: url(../../../engine/fonts/Anton-Regular.woff); }
@font-face { font-family: 'ISans'; src: url(../../../engine/fonts/InstrumentSans-500.woff); font-weight: 500; }
@font-face { font-family: 'ISans'; src: url(../../../engine/fonts/InstrumentSans-600.woff); font-weight: 600; }
@font-face { font-family: 'ISans'; src: url(../../../engine/fonts/InstrumentSans-700.woff); font-weight: 700; }
@font-face { font-family: 'ISerif'; src: url(../../../engine/fonts/InstrumentSerif-Regular.woff); font-style: normal; }
@font-face { font-family: 'ISerif'; src: url(../../../engine/fonts/InstrumentSerif-Italic.woff); font-style: italic; }
@font-face { font-family: 'JMono'; src: url(../../../engine/fonts/JetBrainsMono-500.woff); font-weight: 500; }
@font-face { font-family: 'JMono'; src: url(../../../engine/fonts/JetBrainsMono-700.woff); font-weight: 700; }
:root { --ink: #f7f3ea; --mut: rgba(247,243,234,.62); --dim: rgba(247,243,234,.38); --yel: #ffc83d; --red: #ff4d61; --vio: #b45cff;
  --blue: #4f7dff; --green: #3ee08f; --grad: linear-gradient(90deg, #ff4d61, #b45cff 52%, #4f7dff); }
html, body { margin: 0; width: 1080px; height: 1920px; background: transparent; overflow: hidden; }
body { font-family: ISans, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
#behind, #front { position: absolute; inset: 0; }
body[data-layer=behind] #front, body[data-layer=front] #behind { display: none; }
.abs { position: absolute; }
.hide { display: none !important; }
/* ---------- subtítulos detrás de la cabeza ---------- */
.sub { position: absolute; left: 0; top: 0; text-align: center; white-space: nowrap; transform-origin: 50% 100%; font-size: 132px; }
.sub .ln { display: block; line-height: .93; }
.sub .tk { display: inline-block; font-family: Anton; text-transform: uppercase; font-size: 1em; letter-spacing: .005em; color: var(--ink);
  text-shadow: 0 10px 38px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.35); margin: 0 .09em; will-change: transform; }
.sub .tk.k { font-family: ISerif; font-style: italic; text-transform: none; font-size: 1.16em; color: var(--yel); letter-spacing: -.005em;
  text-shadow: 0 10px 40px rgba(0,0,0,.6), 0 0 26px rgba(255,200,61,.22); }
/* ---------- cristal ---------- */
.glass { position: absolute; border-radius: 34px; background: linear-gradient(180deg, rgba(255,255,255,.13), rgba(255,255,255,.035) 55%), rgba(12,13,20,.40);
  border: 1.5px solid rgba(255,255,255,.17); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.26), inset 0 -1px 0 rgba(0,0,0,.25); overflow: hidden; }
.lab { font: 500 21px/1 JMono, monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--mut); }
.big { font-family: Anton; line-height: .9; }
.gradtxt { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.row { display: flex; align-items: center; }
.ico { width: 46px; height: 46px; flex: none; }
.ico svg { width: 100%; height: 100%; }
.dot { width: 14px; height: 14px; border-radius: 50%; background: var(--red); box-shadow: 0 0 14px var(--red); flex: none; }
.pill { position: absolute; border-radius: 999px; }
.chk { stroke: var(--green); }
.sp { flex: 1; }
</style>
</head>
<body data-layer="front">
<div id="behind"></div>
<div id="front"></div>
<script>
// ------------------------------------------------------------------ utilidades
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - x, 3);
const eIn = x => x * x * x;
const eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => { const c1 = 1.5, c3 = c1 + 1; return x <= 0 ? 0 : x >= 1 ? 1 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const r2 = x => Math.round(x * 100) / 100;
const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };
const ICON = {
  shop: '<path d="M4 10h40l-4-7H8z M6 10v4a5 5 0 0 0 9 0 5 5 0 0 0 9 0 5 5 0 0 0 9 0 5 5 0 0 0 9 0v-4 M8 18v24h32V18 M19 42V30h10v12"/>',
  building: '<path d="M10 43V7h20v36 M30 17h10v26 M6 43h38 M16 14h3 M22 14h3 M16 21h3 M22 21h3 M16 28h3 M22 28h3 M16 35h3 M22 35h3 M34 24h2 M34 31h2"/>',
  bulb: '<path d="M18 36h12 M19 41h10 M24 5a13 13 0 0 0-8 23c1.5 1.4 2 3 2 5h12c0-2 .5-3.6 2-5a13 13 0 0 0-8-23z M24 13v6 M21 16h6"/>',
  box: '<path d="M24 4 42 13v22L24 44 6 35V13z M6 13l18 9 18-9 M24 22v22 M15 8.5l18 9"/>',
  hand: '<path d="M5 24l8-8 7 3 6-5 6 2 11 9 M13 16 5 24l9 10 M43 25l-8 9-4-1 M14 34l4 4c1.4 1.4 3.6 1.4 5 0l1-1 M20 31l5 5c1.4 1.4 3.6 1.4 5 0l1-1 M26 28l5 5c1.4 1.4 3.6 1.4 5 0"/>',
  check: '<path d="M10 25l9 9 19-20"/>',
  cross: '<path d="M13 13l22 22 M35 13 13 35"/>',
  lock: '<path d="M11 21h26v21H11z M16 21v-7a8 8 0 0 1 16 0v7 M24 29v6"/>',
  play: '<path d="M14 9v30l26-15z"/>',
  globe: '<path d="M24 4a20 20 0 1 0 0 40 20 20 0 0 0 0-40z M4 24h40 M24 4c6 6 8 13 8 20s-2 14-8 20c-6-6-8-13-8-20s2-14 8-20z"/>',
  user: '<path d="M24 6a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M7 43c2-9 9-14 17-14s15 5 17 14"/>',
  up: '<path d="M24 41V9 M11 21 24 8l13 13"/>',
  cal: '<path d="M6 11h36v31H6z M6 19h36 M15 5v9 M33 5v9"/>',
  send: '<path d="M5 24 43 6 34 43 23 27z M23 27 43 6"/>',
  spark: '<path d="M24 4c2 9 5 12 14 14-9 2-12 5-14 14-2-9-5-12-14-14 9-2 12-5 14-14z M38 32c1 4 2 5 6 6-4 1-5 2-6 6-1-4-2-5-6-6 4-1 5-2 6-6z"/>',
  target: '<circle cx="24" cy="24" r="19"/><circle cx="24" cy="24" r="12"/><circle cx="24" cy="24" r="5"/>',
  live: '<path d="M14 14a14 14 0 0 0 0 20 M34 14a14 14 0 0 1 0 20 M9 9a21 21 0 0 0 0 30 M39 9a21 21 0 0 1 0 30"/><circle cx="24" cy="24" r="4"/>',
};
const ico = (n, c = 'currentColor', w = 3) => `<div class="ico"><svg viewBox="0 0 48 48" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg></div>`;

// ------------------------------------------------------------------ datos
let TL, SEGS, WD;
const wt = (s, i) => WD[s][i][0];       // la palabra i de la toma s empieza
const we = (s, i) => WD[s][i][1];       // … y acaba
const segT = s => TL.clips[s];                 // inicio y final de una toma (por su nombre) en el vídeo

// ------------------------------------------------------------------ componentes
const COMPS = [];
function add(layer, t0, t1, el, upd, opt = {}) {
  el.style.position = 'absolute';
  document.getElementById(layer).appendChild(el);
  const c = { layer, t0, t1, el, upd, opt, sig: '' };
  COMPS.push(c); return c;
}
// entrada/salida estándar de una tarjeta: sube, crece un poco y se enfoca; sale hacia arriba
function cardAnim(c, t, { din = .42, dout = .28, dy = 46, s0 = .9, from = 'up' } = {}) {
  const ki = eBack(lin(t, c.t0, c.t0 + din)), ko = eIn(lin(t, c.t1 - dout, c.t1));
  const op = clamp(lin(t, c.t0, c.t0 + din * .6)) * (1 - ko);
  const y = (1 - ki) * dy - ko * 26, sc = s0 + (1 - s0) * ki - ko * .04;
  const bl = (1 - clamp(lin(t, c.t0, c.t0 + din * .7))) * 10 + ko * 6;
  c.el.style.opacity = r2(op);
  c.el.style.transform = `translateY(${r2(y)}px) scale(${r2(sc * 1000) / 1000})`;
  c.el.style.filter = bl > .05 ? `blur(${r2(bl)}px)` : 'none';
  return `${r2(op)},${r2(y)},${r2(sc * 1000)},${r2(bl)}`;
}

// ---------- subtítulos detrás de la cabeza
function buildSubs() {
  for (const S of TL.subs) {
    const seg = SEGS[S.seg];
    const el = $('<div class="sub"></div>');
    let j = 0; const toks = []; let inK = false;
    for (const line of S.lines) {
      const ln = $('<span class="ln"></span>');
      for (const w of line) {
        const starts = /^[¿«]?\*/.test(w), ends = /\*[?»,.]?$/.test(w);
        if (starts) inK = true;
        const k = inK;
        if (ends) inK = false;
        const txt = w.replace(/\*/g, '');
        const tk = $(`<span class="tk${k ? ' k' : ''}"></span>`); tk.textContent = txt; ln.appendChild(tk);
        toks.push({ el: tk, t: S.times[j++] });
      }
      el.appendChild(ln);
    }
    const c = add('behind', S.t0 - .05, S.t1 + .01, el, null);
    c.toks = toks; c.seg = seg; c.S = S;
    c.upd = (t) => {
      // tamaño: que la línea más larga quepa en 980 px
      if (!c.fit) {
        el.style.left = '0px'; el.style.top = '0px';
        const wmax = el.getBoundingClientRect().width;
        c.fs = Math.min(1, 960 / wmax);
        el.style.fontSize = '';
        for (const tk of toks) tk.el.style.fontSize = tk.el.classList.contains('k') ? '' : '';
        el.style.transform = `scale(${c.fs})`;
        const r = el.getBoundingClientRect();
        c.w = r.width; c.h = r.height; c.fit = true;
        const cx = clamp(540 + (c.S.headX - 540) * .35, 40 + c.w / 2, 1040 - c.w / 2);
        c.x = cx - c.w / 2; c.y = c.S.headTop + 36 - c.h;
        el.style.transformOrigin = '0 0';
      }
      const ko = eIn(lin(t, c.S.t1 - .12, c.S.t1));
      let sig = '';
      for (const tk of toks) {
        const k = eOut(lin(t, tk.t - .04, tk.t + .16));
        const kk = eBack(lin(t, tk.t - .04, tk.t + .2));
        const op = clamp(k * 1.4) * (1 - ko);
        tk.el.style.opacity = r2(op);
        tk.el.style.transform = `translateY(${r2((1 - kk) * 34 - ko * 22)}px) scale(${r2((.86 + .14 * kk) * 100) / 100})`;
        sig += r2(op) + '/' + r2(kk) + ';';
      }
      el.style.transform = `translate(${r2(c.x)}px, ${r2(c.y)}px) scale(${c.fs})`;
      return sig + r2(ko);
    };
  }
}

// ---------- tarjetas (delante)
function card(t0, t1, html, x, y, w, h, extra = {}) {
  const el = $(`<div class="glass" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">${html}</div>`);
  if (extra.radius) el.style.borderRadius = extra.radius + 'px';
  if (extra.origin) el.style.transformOrigin = extra.origin;
  return add('front', t0, t1, el, null, extra);
}

function buildCards() {
  const S0 = 'a8695', S1 = 'a8699', S2 = 'c8707b', S3 = 'c8707a', S4 = 'c8707c', S5 = 'd8709', S6 = 'e8712';
  // ===== 1 · «quédate hasta el final» (barra de progreso) + «el método Kiria» =====
  for (const [s, i0, iEnd, iLock] of [[S0, 20, 23, 28]]) {
    const t0 = wt(s, i0) - .1, t1 = segT(s)[1] - .02;
    const c = card(t0, t1, `
      <div class="abs" style="left:34px;top:28px" class="lab"><span class="lab">Quédate hasta el final</span></div>
      <div class="abs" style="left:34px;right:34px;top:74px;height:12px;border-radius:6px;background:rgba(255,255,255,.14)"></div>
      <div class="abs fill" style="left:34px;top:74px;height:12px;border-radius:6px;background:var(--grad);box-shadow:0 0 18px rgba(180,92,255,.55)"></div>
      <div class="abs knob" style="top:68px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 0 0 6px rgba(255,255,255,.18),0 0 22px rgba(255,255,255,.6)"></div>
      <div class="abs endtag row" style="right:30px;top:20px;gap:10px;color:var(--yel)">${ico('lock', '#ffc83d', 3.4).replace('class="ico"', 'class="ico" style="width:30px;height:30px"')}<span style="font:700 26px/1 ISans">Método Kiria</span></div>`,
      110, 1418, 860, 118, { radius: 30 });
    const fill = c.el.querySelector('.fill'), knob = c.el.querySelector('.knob'), tag = c.el.querySelector('.endtag');
    const ta = wt(s, i0), tb = we(s, iEnd);
    c.upd = (t) => {
      const sg = cardAnim(c, t, { dy: 60 });
      const p = .12 + .88 * eIO(lin(t, ta, tb));
      const wpx = 792 * p;
      fill.style.width = r2(wpx) + 'px'; knob.style.left = r2(34 + wpx - 12) + 'px';
      const kl = iLock !== null ? eBack(lin(t, wt(s, iLock) - .1, wt(s, iLock) + .25)) : eBack(lin(t, tb, tb + .3));
      tag.style.transform = `scale(${r2(.6 + .4 * kl)})`; tag.style.opacity = r2(clamp(kl * 1.5));
      return sg + r2(p) + r2(kl);
    };
  }
  // ===== 2 · RETO (título de la serie) → se encoge y pasa a ser el marcador de arriba =====
  {
    const t0 = wt(S1, 3) - .05, t1 = wt(S1, 7) - .05;
    const c = card(t0, t1 + .5, `
      <div class="abs lab" style="left:0;right:0;top:34px;text-align:center">Serie · Capítulo 1</div>
      <div class="abs big gradtxt" style="left:0;right:0;top:66px;text-align:center;font-size:230px">RETO</div>
      <div class="abs" style="left:0;right:0;top:288px;text-align:center;font:italic 70px/1 ISerif;color:var(--ink)">10 clientes <span style="color:var(--yel)">en 30 días</span></div>`,
      150, 1110, 780, 400, { origin: '0 0' });
    c.upd = (t) => {
      const ki = eBack(lin(t, c.t0, c.t0 + .45));
      const km = eIO(lin(t, t1, t1 + .5));                     // vuela al marcador (arriba a la izquierda)
      const op = clamp(lin(t, c.t0, c.t0 + .25)) * (1 - clamp(lin(t, t1 + .3, t1 + .5)));
      const sc = (.88 + .12 * ki) * (1 - .78 * km);
      const x = (1 - km) * 0 + km * (44 - 150), y = (1 - ki) * 50 + km * (178 - 1110);
      c.el.style.opacity = r2(op); c.el.style.transform = `translate(${r2(x)}px, ${r2(y)}px) scale(${r2(sc * 1000) / 1000})`;
      c.el.style.filter = ki < .7 ? `blur(${r2((1 - ki) * 9)}px)` : 'none';
      return [op, x, y, sc].map(r2).join(',');
    };
    // marcador fijo: RETO 0/10 · DÍA 1/30
    const h = card(t1 + .3, TL.total + 1, `
      <div class="row" style="height:100%;padding:0 26px;gap:16px">
        <div class="dot pulse"></div>
        <span style="font:700 25px/1 JMono;letter-spacing:.08em">RETO</span>
        <span style="width:1.5px;height:30px;background:rgba(255,255,255,.25)"></span>
        <span style="font:700 25px/1 JMono"><span style="color:var(--yel)">0</span>/10 <span style="font-weight:500;color:var(--mut)">CLIENTES</span></span>
        <span style="width:1.5px;height:30px;background:rgba(255,255,255,.25)"></span>
        <span style="font:700 25px/1 JMono">DÍA 1<span style="font-weight:500;color:var(--mut)">/30</span></span>
      </div>`, 44, 178, 560, 70, { radius: 35, origin: '0 50%' });
    const pd = h.el.querySelector('.pulse');
    h.upd = (t) => {
      const k = eBack(lin(t, h.t0, h.t0 + .4));
      h.el.style.opacity = r2(clamp(lin(t, h.t0, h.t0 + .2)) * (1 - lin(t, TL.total - .9, TL.total - .6)));
      h.el.style.transform = `scale(${r2(.7 + .3 * k)})`;
      const pp = .55 + .45 * Math.abs(Math.sin((t - h.t0) * 3.2));
      pd.style.opacity = r2(pp); return r2(k) + ',' + r2(pp) + ',' + h.el.style.opacity;
    };
  }
  // ===== 3 · 10 huecos (clientes) + «tu negocio × kiria» =====
  {
    const t0 = wt(S1, 7) - .1, t1 = wt(S1, 14) - .05;
    let slots = '';
    for (let i = 0; i < 10; i++) slots += `<div class="slot abs" style="left:${40 + (i % 5) * 158}px;top:${118 + Math.floor(i / 5) * 132}px;width:108px;height:108px;border-radius:50%;border:2.5px dashed rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font:700 30px JMono;color:var(--dim)">${i + 1}</div>`;
    const c = card(t0, t1, `
      <div class="abs lab" style="left:40px;top:38px">Clientes del reto</div>
      <div class="abs" style="right:40px;top:22px;font:700 54px/1 JMono"><span style="color:var(--yel)">0</span><span style="color:var(--mut)">/10</span></div>
      ${slots}`, 110, 1160, 860, 400);
    const sl = [...c.el.querySelectorAll('.slot')];
    const ta = wt(S1, 7), tb = we(S1, 8);
    c.upd = (t) => {
      let sg = cardAnim(c, t);
      sl.forEach((e, i) => { const ti = ta + (tb - ta + .25) * i / 10; const k = eBack(lin(t, ti, ti + .22));
        e.style.transform = `scale(${r2(k)})`; e.style.opacity = r2(clamp(k)); sg += r2(k); });
      return sg;
    };
    const p = add('front', wt(S1, 11) - .1, t1, $(`<div class="glass" style="left:230px;top:1040px;width:620px;height:92px;border-radius:46px">
      <div class="row" style="height:100%;justify-content:center;gap:22px;font:700 40px/1 ISans">
        <span>Tu negocio</span><span style="font:400 44px/1 ISans;color:var(--yel)">×</span><span style="font-family:Anton;font-size:46px;letter-spacing:.01em">kiria<span style="color:var(--red)">.</span>ai</span>
      </div></div>`), null);
    p.upd = t => cardAnim(p, t, { dy: 30 });
  }
  // ===== 4 · despegar visualizaciones (gráfica que despega) =====
  {
    const t0 = wt(S1, 14) - .1, t1 = wt(S1, 22) - .05;
    const c = card(t0, t1, `
      <div class="abs row" style="left:32px;top:30px;gap:12px">${ico('up', '#3ee08f', 3.6).replace('class="ico"', 'class="ico" style="width:34px;height:34px"')}<span class="lab" style="color:var(--ink)">Visualizaciones</span></div>
      <svg class="abs" style="left:20px;top:84px" width="400" height="236" viewBox="0 0 430 250" preserveAspectRatio="none">
        <defs><linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#ff4d61"/><stop offset=".5" stop-color="#b45cff"/><stop offset="1" stop-color="#4f7dff"/></linearGradient>
        <linearGradient id="g2" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#b45cff" stop-opacity=".35"/><stop offset="1" stop-color="#b45cff" stop-opacity="0"/></linearGradient></defs>
        <g stroke="rgba(255,255,255,.08)" stroke-width="1.5"><path d="M0 50H430M0 110H430M0 170H430M0 230H430"/></g>
        <path class="area" fill="url(#g2)" d=""/>
        <path class="ln" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round" d=""/>
        <circle class="tip" r="10" fill="#fff"/>
      </svg>`, 40, 920, 440, 340);
    const pth = c.el.querySelector('.ln'), area = c.el.querySelector('.area'), tip = c.el.querySelector('.tip');
    const f = x => 232 - 200 * (Math.exp(4.2 * x) - 1) / (Math.exp(4.2) - 1) - 6 * Math.sin(x * 14) * (1 - x);
    const ta = wt(S1, 15), tb = we(S1, 21);
    c.upd = (t) => {
      const sg = cardAnim(c, t);
      const p = .04 + .96 * eIO(lin(t, ta, tb));
      let d = '', n = 60;
      for (let i = 0; i <= n; i++) { const x = p * i / n; d += (i ? 'L' : 'M') + r2(10 + x * 400) + ' ' + r2(f(x)); }
      pth.setAttribute('d', d); area.setAttribute('d', d + `L${r2(10 + p * 400)} 250L10 250Z`);
      tip.setAttribute('cx', r2(10 + p * 400)); tip.setAttribute('cy', r2(f(p)));
      return sg + r2(p);
    };
  }
  // ===== 5 · objetivo (diana) =====
  {
    const t0 = wt(S1, 22) - .1, t1 = segT(S1)[1] - .02;
    const c = card(t0, t1, `
      <svg class="abs" style="left:30px;top:30px" width="200" height="200" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="10"/>
        <circle cx="100" cy="100" r="58" fill="none" stroke="rgba(255,77,97,.75)" stroke-width="10"/>
        <circle cx="100" cy="100" r="26" fill="#ff4d61"/>
        <g class="arrow"><path d="M100 100 L190 10" stroke="#fff" stroke-width="7" stroke-linecap="round"/><path d="M178 4 L196 4 L196 22" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
      </svg>
      <div class="abs lab" style="left:260px;top:62px">Sus metas</div>

    c.upd = t => { const sg = cardAnim(c, t); const word = 'NEGOCIO'; const n = Math.round(clamp(lin(t, ta, tb)) * word.length);
      typ.textContent = word.slice(0, n); car.style.opacity = (Math.floor((t - t0) * 3) % 2 === 0 || n < word.length) ? 1 : 0;
      const ks = eBack(lin(t, tb, tb + .3)); snd.style.transform = `scale(${r2(1 + .25 * Math.sin(ks * Math.PI))})`;
      return sg + n + car.style.opacity + r2(ks); };
    const l = add('front', wt(S5, 29) - .08, t1, $(`<div class="glass" style="left:200px;top:1170px;width:680px;height:120px;border-radius:60px">
      <div class="row" style="height:100%;justify-content:center;gap:16px"><span style="font-family:Anton;font-size:56px;letter-spacing:.01em">kiriaai<span style="color:var(--red)">.</span>com</span><span style="font:700 46px/1 ISans;color:var(--yel)">↗</span>
      <span class="lab" style="margin-left:6px">enlace en la bio</span></div></div>`), null);
    l.upd = t => cardAnim(l, t, { dy: 30 });
  }
  // ===== 17 · ganar tus clientes de forma exponencial =====
  {
    const t0 = wt(S5, 32) - .08, t1 = segT(S5)[1] - .02;
    const c = card(t0, t1, `
      <div class="abs row" style="left:32px;top:30px;gap:12px">${ico('user', '#3ee08f', 3.4).replace('class="ico"', 'class="ico" style="width:34px;height:34px"')}<span class="lab" style="color:var(--ink)">Tus clientes</span></div>
      <svg class="abs" style="left:20px;top:84px" width="400" height="236" viewBox="0 0 430 250" preserveAspectRatio="none">
        <g stroke="rgba(255,255,255,.08)" stroke-width="1.5"><path d="M0 50H430M0 110H430M0 170H430M0 230H430"/></g>
        <path class="ln" fill="none" stroke="#3ee08f" stroke-width="7" stroke-linecap="round" d=""/><circle class="tip" r="10" fill="#fff"/></svg>
      <div class="abs" style="right:28px;bottom:20px;font:italic 46px/1 ISerif;color:var(--yel)">exponencial</div>`, 40, 900, 440, 340);
    const pth = c.el.querySelector('.ln'), tip = c.el.querySelector('.tip');
    const f = x => 232 - 210 * (Math.exp(4.4 * x) - 1) / (Math.exp(4.4) - 1);
    const ta = wt(S5, 34), tb = we(S5, 39);
    c.upd = t => { const sg = cardAnim(c, t, { dy: 0, s0: .85 }); const p = .05 + .95 * eIO(lin(t, ta, tb)); let d = '';
      for (let i = 0; i <= 50; i++) { const x = p * i / 50; d += (i ? 'L' : 'M') + r2(10 + x * 400) + ' ' + r2(f(x)); }
      pth.setAttribute('d', d); tip.setAttribute('cx', r2(10 + p * 400)); tip.setAttribute('cy', r2(f(p))); return sg + r2(p); };
  }
  // ===== 18 · cupón: −10 % hasta el 30 de noviembre · KIRIA10 · kiriaai.com =====
  {
    const t0 = wt(S6, 0) - .1, t1 = segT(S6)[1] + .6;
    const c = card(t0, t1, `
      <div class="abs lab" style="left:40px;top:34px;color:var(--yel)">Y recuerda…</div>
      <div class="abs pc big gradtxt" style="left:34px;top:76px;font-size:200px">−10%</div>
      <div class="abs" style="left:476px;top:30px;bottom:30px;border-left:3px dashed rgba(255,255,255,.28)"></div>
      <div class="abs dt" style="left:516px;top:44px"><div class="lab">Hasta el</div><div style="font:italic 66px/1.05 ISerif;margin-top:8px">30 de<br>noviembre</div></div>
      <div class="abs cd" style="left:516px;top:228px"><div class="lab">Código</div><div style="margin-top:10px;font:700 40px/1 JMono;letter-spacing:.08em;padding:12px 18px;border:2px dashed rgba(255,200,61,.8);border-radius:14px;color:var(--yel);display:inline-block">KIRIA10</div></div>
      <div class="abs ws row" style="left:40px;top:300px;gap:10px;font-family:Anton;font-size:52px;letter-spacing:.01em">kiriaai<span style="color:var(--red)">.</span>com</div>`,
      110, 1150, 860, 400);
    const pc = c.el.querySelector('.pc'), dt = c.el.querySelector('.dt'), cd = c.el.querySelector('.cd'), ws = c.el.querySelector('.ws');
    const pop = (e, ta) => { const k = eBack(lin(ta === null ? -1 : 0, 0, 1)); };
    c.upd = t => { const sg = cardAnim(c, t);
      const a = eBack(lin(t, wt(S6, 4) - .05, wt(S6, 4) + .3)), b = eBack(lin(t, wt(S6, 10) - .1, wt(S6, 10) + .3)), d = eBack(lin(t, wt(S6, 11), wt(S6, 11) + .3)), e = eBack(lin(t, wt(S6, 12), wt(S6, 12) + .3));
      dt.style.opacity = r2(clamp(a)); dt.style.transform = `translateY(${r2((1 - a) * 20)}px)`;
      pc.style.opacity = r2(clamp(b)); pc.style.transform = `scale(${r2(.6 + .4 * b)})`; pc.style.transformOrigin = '30% 60%';
      cd.style.opacity = r2(clamp(d)); cd.style.transform = `translateY(${r2((1 - d) * 20)}px)`;
      ws.style.opacity = r2(clamp(e)); ws.style.transform = `translateY(${r2((1 - e) * 20)}px)`;
      return sg + [a, b, d, e].map(r2).join(','); };
  }
  // ===== 19 · cierre: el método Kiria, cada jueves =====
  {
    const t0 = segT(S6)[1] + .45, t1 = TL.total + 1;
    const c = card(t0, t1, `
      <div class="abs lab" style="left:0;right:0;top:44px;text-align:center">Reto · 0/10 clientes</div>
      <div class="abs" style="left:0;right:0;top:92px;text-align:center;font:italic 92px/1 ISerif">El método <span style="color:var(--yel)">Kiria</span>,</div>
      <div class="abs" style="left:0;right:0;top:188px;text-align:center;font:italic 92px/1 ISerif">cada jueves.</div>
      <div class="abs" style="left:110px;right:110px;top:316px;height:4px;border-radius:2px;background:var(--grad)"></div>
      <div class="abs" style="left:0;right:0;top:350px;text-align:center;font:600 36px/1.3 ISans;color:var(--mut)">Capítulo 2 · jueves 19 de noviembre</div>
      <div class="abs row" style="left:170px;right:170px;top:430px;height:92px;border-radius:46px;background:#ffc83d;color:#111;justify-content:center;gap:14px;font:700 38px/1 ISans">Comenta «NEGOCIO» ${ico('send', '#111', 3.6).replace('class="ico"', 'class="ico" style="width:36px;height:36px"')}</div>`,
      100, 700, 880, 570);
    c.upd = t => cardAnim(c, t, { dy: 40, s0: .9, din: .5 });
  }
}

// ------------------------------------------------------------------ render
function renderAt(t, layer) {
  document.body.dataset.layer = layer;
  let sig = [];
  for (const c of COMPS) {
    if (c.layer !== layer) continue;
    const on = t >= c.t0 && t <= c.t1;
    if (!on) { if (!c.el.classList.contains('hide')) c.el.classList.add('hide'); continue; }
    c.el.classList.remove('hide');
    sig.push(COMPS.indexOf(c) + ':' + (c.upd ? c.upd(t) : ''));
  }
  const glass = [];
  if (layer === 'front') {
    for (const c of COMPS) {
      if (c.layer !== 'front' || c.el.classList.contains('hide')) continue;
      const els = c.el.classList.contains('glass') ? [c.el] : [...c.el.querySelectorAll('.glass')];
      for (const g of els) {
        const r = g.getBoundingClientRect(); const op = parseFloat(getComputedStyle(c.el).opacity);
        const rad = parseFloat(getComputedStyle(g).borderTopLeftRadius) * (r.width / g.offsetWidth);
        if (r.width > 2 && op > .01) glass.push({ x: r2(r.x), y: r2(r.y), w: r2(r.width), h: r2(r.height), r: r2(rad), o: r2(op) });
      }
    }
  }
  return { sig: sig.join('|'), glass };
}

(async () => {
  TL = await (await fetch('timeline.json')).json();
  SEGS = TL.segs; WD = TL.words;
  await document.fonts.load('132px Anton'); await document.fonts.load('italic 60px ISerif'); await document.fonts.load('500 20px JMono');
  await document.fonts.load('700 20px JMono'); await document.fonts.load('600 20px ISans'); await document.fonts.load('700 20px ISans'); await document.fonts.load('500 20px ISans'); await document.fonts.load('60px ISerif');
  await document.fonts.ready;
  buildSubs(); buildCards();
  const imgs = [...document.images]; await Promise.all(imgs.map(i => i.complete ? 1 : new Promise(r => { i.onload = r; i.onerror = r; })));
  window.renderAt = renderAt; window.TL = TL; window.ready = true;
})().catch(e => { window.failed = String(e && e.stack || e); });
